version: "3.9"

services:

  db:
    image: postgres:16

    container_name: inventory_db

    restart: always

    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:

    build: ./backend

    container_name: inventory_backend

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app

    depends_on:
      - db

    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: inventory_db
      DB_USER: postgres
      DB_PASSWORD: postgres

  frontend:

    build: ./frontend

    container_name: inventory_frontend

    ports:
      - "5173:5173"

    depends_on:
      - backend

volumes:
  postgres_data: